on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      name: Checkout Code
      uses: actions/checkout@v4

      name: Set Python
      uses: actions/checkout@v5
      with:
        python-version: 3.12
        cache: "pip"

      name: Run PyTest
      uses: pytest tests/unit  -v

      name: Build Docker Image And Initiate Container
      uses: docker compose up -d

      name: Stop Compose Service
      if: always()
      uses: docker compose down -v 
 

      

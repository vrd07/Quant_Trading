# Live Trading Environment Configuration
# $1,000 Account Size
# Rules: 2.5% daily loss ($25), 7% max trailing drawdown ($60)
# Risk per trade: $5 (0.50%) — 0.01 lot XAUUSD × 50 pip stop = $5
# Target profit:  $12.50 per trade (RR 2.5)
# News Trading: Restricted (±5 min around high-impact news)
# Overnight & Weekend Holding: Allowed
#
# Audit-hardened config (Apr 2026):
#   - Mini Medallion DISABLED (negative expectancy)
#   - Kalman long_only (SELL side loses money on Gold)
#   - Pre-trade daily loss budget gate (85%)
#   - Tightened circuit breaker (3 losses / 30 min)

environment: live

account:
  initial_balance: 1000.0
  currency: USD
  leverage: 100

symbols:
  AUDJPY:
    enabled: true
    # wednesday_drift ONLY — the rest of the roster is gold/FX-validated; the
    # whitelist keeps them off this cross. ⚠️ value_per_lot is a seed; the live
    # GET_SYMBOL_SPEC auto-spec refines it from the broker.
    strategy_whitelist: [wednesday_drift]
    pip_value: 0.001          # JPY cross: 3-decimal quote
    min_lot: 0.01
    max_lot: 0.50
    lot_step: 0.01
    value_per_lot: 658        # USD per 1.0 AUDJPY move per lot (~100k JPY / USDJPY~152) — auto-spec refines
    commission_per_lot: 0.0
    leverage: 100
    max_notional_pct: 4.0
    min_stops_distance: 0.05
    max_spread: 0.05

  USDJPY:
    enabled: false
    pip_value: 0.001          # 1 point (= 0.1 pip; JPY pairs quote 3 decimals)
    min_lot: 0.01
    max_lot: 0.50
    lot_step: 0.01
    value_per_lot: 659        # USD per 1.0 JPY move per lot = 100k JPY / avg USDJPY ~152
    commission_per_lot: 0.0
    leverage: 100             # FX 1:100
    max_notional_pct: 4.0     # clamp lots to 400% balance notional — tight Asia-range stops
                              # otherwise demand >1 lot and hit the 500% exposure rejection
    min_stops_distance: 0.05  # 5 pips
    max_spread: 0.03          # 3 pips

  GBPUSD:
    enabled: false              # monday_drift pair — live in config_live_5000 only
    strategy_whitelist: [monday_drift]   # never let the XAUUSD roster fire here
    pip_value: 0.00001
    min_lot: 0.01
    max_lot: 0.50
    lot_step: 0.01
    value_per_lot: 100000
    commission_per_lot: 0.0
    leverage: 100
    max_notional_pct: 4.0
    min_stops_distance: 0.0005
    max_spread: 0.0003

  AUDUSD:
    enabled: false              # monday_drift pair — live in config_live_5000 only
    strategy_whitelist: [monday_drift]
    pip_value: 0.00001
    min_lot: 0.01
    max_lot: 0.50
    lot_step: 0.01
    value_per_lot: 100000
    commission_per_lot: 0.0
    leverage: 100
    max_notional_pct: 4.0
    min_stops_distance: 0.0005
    max_spread: 0.0003

  XAUUSD:
    enabled: true
    pip_value: 0.01
    min_lot: 0.01
    max_lot: 0.01
    lot_step: 0.01
    value_per_lot: 100
    commission_per_lot: 0.0
    leverage: 30
    min_stops_distance: 1.0
    max_spread: 3.5

  US30:
    enabled: true
    # index_overnight ONLY — the rest of the roster is gold/FX-validated; the
    # whitelist keeps them off this index. ⚠️ VERIFY contract spec vs broker
    # (MT5 → Symbols → Specification): min_lot / value_per_lot drive sizing &
    # the drawdown cap. Defaults assume a 0.01-min-lot, $1/point index CFD.
    strategy_whitelist: [index_overnight]
    pip_value: 1.0
    min_lot: 0.01
    max_lot: 10.0
    lot_step: 0.01
    value_per_lot: 1            # USD per 1.0 index-point move per 1.0 lot — VERIFY
    commission_per_lot: 0.0
    leverage: 20               # indices ~1:20 — VERIFY
    max_notional_pct: 4.0      # clamp lots (wide ATR stop → min-lot can over-risk)
    min_stops_distance: 1.0
    max_spread: 8.0

risk:
  # 2026-06-24 correlation guard: index_overnight runs on US30 only
  # (single index symbol; cluster keeps it to one concurrent
  # slot. Kept separate from the gold-coil cluster (uncorrelated to gold).
  correlation_guard:
    enabled: true
    max_per_cluster: 1
    clusters:
      - [squeeze_breakout, stoch_pullback]   # gold coils, +0.34 corr
      - [index_overnight]                    # sole index symbol (NAS100 dropped — no broker CFD)
  decay_floor:
    enabled: true            # 2026-06-21 decay-floor allocator (scripts/strategy_allocator.py)
    weights_file: data/strategy_risk_weights.json
  # $1,000 Account Risk Parameters
  max_drawdown_pct: 0.07          # 7% Max Overall/Trailing Drawdown ($70)
  max_daily_loss_pct: 0.025       # 2.5% Max Daily Loss ($25)

  # $5 risk per trade = 0.50% of $1,000
  # Basis: 0.01 lot XAUUSD × 50 pip stop × $10/pip/lot = $5
  risk_per_trade_pct: 0.005       # 0.50% = $5 per trade

  # Fixed per-trade take-profit target in USD (set via runtime_setup).
  # 0 = disabled → strategies keep their own ATR/structure TP. When > 0,
  # execution_engine rewrites every trade's TP to bank exactly this much.
  take_profit_usd: 0

  # Reward:risk for the budget TP. When the start-script max-loss (risk_per_trade_usd)
  # drives the SL via BudgetSL, the TP is set to rr × that SL distance (1:1/1:2/1:3).
  # Per-strategy `strategies.<name>.rr` overrides this global default.
  reward_risk_ratio: 2.0

  # Liquidity TP snapping (2026-08-07). Moves the target to just short of an un-swept
  # pool when one sits within band_pct of the current target distance.
  # Spec: docs/superpowers/specs/2026-08-07-liquidity-tp-overlay-design.md
  # kalman_regime is deliberately absent: its live target is rr x budget_sl_dist while
  # its backtest target is tp_atr_multiplier x ATR, so a backtest A/B would validate a
  # take-profit it never actually uses live.
  liquidity_tp_overlay:
    enabled: false
    band_pct: 0.25
    buffer_atr: 0.05
    min_rr: 1.2
    history_bars: 2500
    strategies: [squeeze_breakout, stoch_pullback, bos_structure]
    symbols: [XAUUSD]

  # Per-strategy risk override (added 2026-05-06).
  # NOTE (2026-06-20): this override is effectively INERT while the XAUUSD lot
  # is pinned (symbols.XAUUSD.min_lot == max_lot == 0.01, runtime_setup-fixed):
  # the sizer honors the fixed lot verbatim and never sizes off this cap. It
  # only feeds risk_engine CHECK 16, which itself bypasses for min_lot orders.
  # Kept for when a non-pinned lot is used. Per-trade $ risk is actually governed
  # by the budget-SL (risk.risk_per_trade_pct × balance ≈ 0.5%).
  strategy_risk_overrides:
    bos_structure:
      risk_per_trade_pct: 0.0048 # cap must sit ABOVE what the sizer actually produces
                                 # (structural stops + lot rounding overshoot ≈ $110-230
                                 # on $50k) or the validator rejects nearly every trade
                                 # (kalman had the same silent-rejection issue). The
                                 # daily worst-case budget still blocks the wide-stop
                                 # tail — that's intended (found 2026-07-08/09).
    wednesday_drift:
      risk_per_trade_pct: 0.01   # 1% of balance — auto-scales (AUDJPY Wed drift, sweep-tuned like index_overnight)
    index_overnight:
      risk_per_trade_pct: 0.01   # 1% of balance — auto-scales every account.
                                 # Sweep-tuned on $5k (=$50/trade): ~4× the $15-default
                                 # contribution at −2.4% DD (half the cap); see
                                 # reports/index_overnight_tuesday_research.md.
    kalman_regime:
      risk_per_trade_usd: 33   # 2026-06-21: ×0.66 (SL-22 equiv) — shrinks per-trade $ loss to fit DD inside 7% cap

  # ABSOLUTE DOLLAR LOSS/PROFIT LIMITS
  # Scaled 2026-06-20 from the original $1k seeds to the live ~$4.7k equity so
  # the dollar caps agree with the percentage caps (max_daily_loss_pct 0.025 /
  # max_drawdown_pct 0.07). The frozen $1k seeds ($25/$60) were silently
  # over-rejecting backtest trades: one trade's worst case (~0.5% ≈ $23.5) had
  # grown past the frozen $21.25 daily gate. runtime_setup overwrites these at
  # live launch from operator input; these are the committed/backtest defaults.
  absolute_max_loss_usd: 117      # Daily loss limit (~2.5% of $4.7k)
  max_drawdown_usd: 329           # Overall drawdown limit (~7% of $4.7k)
  max_daily_profit_usd: 140       # Stop trading for the day once daily profit hit
  daily_loss_budget_safety_pct: 0.85  # Pre-trade budget gate: reject if worst-case SL hit
                                      # would push daily loss past 85% of $117 ≈ $99

  # ── Kalman TP sizing (2026-05-27) ────────────────────────────────
  # Kalman SL stays user-set (strategies.kalman_regime.sl_atr_multiplier);
  # TP is risk-engine-driven off the confidence R:R tier, then floored here
  # so TP distance always exceeds SL distance (never a sub-1R target).
  kalman_min_tp_rr: 1.0

  # ── Confidence-based reversal / flip (2026-05-27) ────────────────
  # An opposite-direction signal with higher confidence than an open bot
  # position closes the weaker trade and takes the stronger one at once,
  # bypassing the directional lock + reversal buffer.
  confidence_flip:
    enabled: true
    min_confidence_margin: 0.0       # extra confidence pts (0-100) the new signal must beat by

  max_positions: 1                # Small account — 1 position at a time
  max_daily_trades: 10            # Conservative trade count
  max_exposure_per_symbol_pct: 5.0
  max_daily_wins: 6               # Stop trading once 6 wins hit

  position_sizing:
    method: fixed
    fixed_lots:
      XAUUSD: 0.01
      ETHUSD: 0.01
      default: 0.01
  circuit_breaker:
    enabled: true
    max_consecutive_losses: 3      # Tightened — audit standard
    cooldown_minutes: 30
    loss_pause_consecutive: 2
    loss_pause_minutes: 30

  # News/high-loss blackout — suppresses ALL orders during these UTC hours.
  trading_windows:
    enabled: true
    blocked_hours_utc: []

  # Per-trade + daily cap enforcement for manual MT5 clicks.
  manual_guard:
    enabled: true
    daily_loss_cap_usd: 10             # $10/day manual loss cap
    size_multiplier: 0.5
    max_risk_per_trade_usd: 5          # $5 per manual trade
    auto_close_violations: false
    directional_lock: true             # Block bot signals opposite to manual trades

  trailing_stop:
    enabled: true
    # Per-strategy exits (strategy name from the MT5 order comment).
    # london_breakout's validated exit is SL-or-time-stop, no BE/lock moves.
    strategy_overrides:
      wavelet_cycle:
        # CEILING for the spec's dynamic 1.5x-cycle time stop, not the stop
        # itself: 1.5 * max_period(48) * 15m = 1080 min. The strategy publishes
        # its per-trade value as metadata['time_stop_minutes'] and that value
        # is honoured live (TrailingStopManager.register_time_stop) and in
        # backtests (SimulatedBroker._resolve_time_stop) -- but only ever to
        # HOLD SHORTER. A strategy cannot exceed the number below, and after a
        # restart the position falls back to it.
        time_stop_minutes: 1080
        disable_be_lock: true
      london_breakout:
        time_stop_minutes: 360
        disable_be_lock: true
      monday_drift:
        time_stop_minutes: 1230   # flat ~20:45 UTC Monday, before rollover
        disable_be_lock: true
      index_overnight:
        time_stop_minutes: 1050   # enter ~Tue 20:00 UTC → flat ~Wed 13:30 (US cash open)
        disable_be_lock: true     # BE/lock tightening destroys an overnight drift hold
      wednesday_drift:
        time_stop_minutes: 1440   # enter ~Tue 20:00 UTC → flat ~Wed 20:00 (session close)
        disable_be_lock: true     # BE/lock tightening destroys a mid-week drift hold
      bos_structure:
        disable_be_lock: true     # BE/lock tightening breaks the structural RR2.0 geometry
    breakeven_atr_mult: 1.2
    lock_atr_mult: 2.0
    lock_fraction: 0.5
    ml_exhaustion_factor: 0.8

strategies:

  # ── LONDON BREAKOUT (USDJPY ONLY — hard-gated in code) ─────────────────────
  # Asia 00-07 UTC range; first 5m close beyond it 07:00-09:59 enters with the
  # break; SL = 0.5 x range; NO TP — exit is the trailing_stop strategy_overrides
  # time stop (360 min). Research 2026-06-11 (2.5y Dukascopy): PF 1.23 IS / 1.44
  # OOS, positive 2024/25/26. FAILED the strict-fill gate (PF ~1.0) — live by
  # user decision 2026-06-11; realistic-fill backtest PF 1.39 / +32%.
  # ── SQUEEZE BREAKOUT (XAUUSD ONLY — hard-gated in code) ─────────────────────
  # Volatility-coil → expansion breakout on XAUUSD 15m. Research SL33pts/RR2.0:
  # 2026 PF 1.27 (+$3,120) / 2025 OOS PF 1.05 (+$660); cost-robust under strict
  # fills; session filter REFUTED → trade all hours. Shipped by user decision as
  # a diversifier stream — MARGINAL standalone (OOS just under the 1.10 bar),
  # same instrument as kalman. scripts/research_squeeze_breakout.py.
  squeeze_breakout:
    enabled: true
    timeframe: 15m
    atr_period: 14
    pct_window: 100          # ATR percentile lookback
    pct: 0.20                # squeeze = ATR <= 20th pctile of last 100 bars
    donch: 20                # coil Donchian channel
    slope_bars: 3            # Kalman flatness lookback
    flat_atr_mult: 0.5       # |kalman slope| <= 0.5*ATR == flat
    coil_lookback: 6         # breakout must follow a coil within 6 bars
    min_penetration_atr: 0.1    # reject shallow fakeout breaks (<0.1*ATR past Donchian) — loser-profile filter (2026-06-22)
    atr_expansion_ratio: 1.05   # require a real vol surge (ATR >= 1.05x prior bar), not a mere uptick
    htf_ema_period: 400         # HTF-trend gate: only breaks aligned w/ EMA400 (BUY above / SELL below); 0=off. Halves DD, lifts PF both yrs
    cooldown_bars: 8         # one entry per fresh coil
    kalman_q: 0.00001
    kalman_r: 0.01
    sl_points: 33            # FIXED 33pt stop = research geometry (engine PF 1.20 '26 / 1.13 full).
    sl_atr_multiplier: 3.0   # only used if sl_points: null — 3xATR floats too wide, PF 0.99 (inferior)
    rr: 2.0                  # TP = SL*RR — RR2.0 is the edge (RR1.0 loses both years)
    timeframe_minutes: 15
    allowed_symbols: [XAUUSD]

  stoch_pullback:
    enabled: false           # 2026-06-22: disabled at $1k — enforced backtest goes dormant after Q1 2025 (35 trades then halted); not a live ongoing edge at this size
    timeframe: 15m
    trend_ema: 50            # EMA trend filter (price side + slope)
    stoch_period: 14         # Stochastic(14,3)
    pull_lo: 20              # don't chase entries below this %K
    pull_hi: 30              # cool-off zone ceiling — %K must dip <=30 to arm
    arm_window: 10           # pullback memory: %K dipped within last 10 bars
    range_bars: 5            # consolidation lookback for the breakout + structural stop
    buffer_pts: 0.10         # stop placed this far behind the range
    min_stop_pts: 2.0        # reject if structural stop is tighter than this
    min_ema_dist_atr: 1.0       # trend-extension: price must be >=1*ATR from EMA in trend dir (else chop = loser cluster); 0=off (2026-06-22)
    atr_period: 14              # ATR period for the trend-extension filter
    rr: 2.0                  # TP = rr * structural SL — RR2.0 is the edge (2026 PF 1.31 / 2025 1.19)
    cooldown_bars: 5         # one entry per fresh breakout
    session_start_hour: 7    # London open (UTC) — session filter ~halves drawdown
    session_end_hour: 21     # through NY (exclusive). 0/24 = all hours
    timeframe_minutes: 15
    allowed_symbols: [XAUUSD]

  bos_structure:
    enabled: true
    timeframe: 15m
    # SPEC-STRICT cell (2026-07-07 tuning post-mortem): every frequency
    # relaxation (pivot 3/4, arm 1, multi-shot, break entries) FAILED the
    # production engine (PF 0.66-0.88, see reports/bos_structure_research.md) —
    # the edge only exists in the selective one-position stream. Keep the two
    # validated fixes: trailing_stop disable_be_lock + single_position latch.
    pivot_bars: 5            # fractal width — N=5 validated (3/4 relaxations died in-engine)
    arm_after_bos: 2         # spec: arm entries after the SECOND BOS
    one_shot: true           # one entry per BOS
    entry_on_break: false    # pullback-pivot entries only
    single_position: true    # ⚠️ REQUIRED: virtual one-position latch — the edge only
                             # exists one-trade-at-a-time (see strategy docstring)
    htf_ema_period: 600      # HTF side-alignment gate (BUY above / SELL below EMA600 15m
                             # ≈ EMA150 1H); both research yrs improve; 0 = off (2026-07-08)
    rr: 2.0                  # TP = rr × structural SL
    buffer_atr: 0.10         # stop buffer beyond the entry pivot, ATR-scaled
    min_stop_pts: 2.0        # reject if structural stop tighter than this
    atr_period: 14
    cooldown_bars: 0         # research sim has no cooldown; engine governs overlap
    timeframe_minutes: 15
    allowed_symbols: [XAUUSD]  # hard gate — US30 FAILED the same research (PF 1.05)

  wednesday_drift:
    enabled: true
    timeframe: 15m
    entry_dow: 1               # Tuesday (enters for the Wednesday session move)
    entry_hour_utc: 19         # entry window opens 19:45 UTC (≈ session close 20:00)
    entry_minute_utc: 45
    atr_period: 14
    stop_atr_multiplier: 1.5   # WIDE guard only (research ran no stop at −5% DD); time stop is the real exit
    signal_strength: 0.60
    allowed_symbols: [AUDJPY]

  index_overnight:
    enabled: true
    timeframe: 15m
    entry_dow: 1               # Tuesday (0=Mon) — "Turnaround Tuesday" night drift
    entry_hour_utc: 19         # entry window opens 19:45 UTC (≈ US cash close 20:00)
    entry_minute_utc: 45
    atr_period: 14             # daily ATR for the catastrophe stop
    stop_atr_multiplier: 1.5   # WIDE guard only (research ran no stop at −3% DD); time stop is the real exit
    signal_strength: 0.60
    allowed_symbols: [US30]

  london_breakout:
    enabled: true    # 2026-06-12: enabled in all configs (user decision; USDJPY-only hard gate in code)
    timeframe: 5m
    asia_end_hour: 7
    entry_start_hour: 7
    entry_end_hour: 12    # 2026-06-12: variant B widened window 07:00-11:59 UTC (user decision; marginal trades PF~1.17, slightly dilutive)
    stop_range_fraction: 0.5
    min_asia_bars: 36         # >=3h of 5m bars or no trade
    min_asia_range: 0.0
    signal_strength: 0.65
    allowed_symbols: [USDJPY]

  # ── MONDAY DRIFT (GBPUSD/AUDUSD ONLY — hard-gated in code) ──────────────────
  # Long-only Monday anti-USD drift hold (see config_live_5000.yaml for the
  # research notes). Disabled here — enabled only on the 5000 account.
  monday_drift:
    enabled: true
    timeframe: 15m
    entry_hour_utc: 0
    sma_period: 50
    atr_period: 14
    stop_atr_multiplier: 1.0
    signal_strength: 0.60
    allowed_symbols: [GBPUSD, AUDUSD]

  signal_cooldown_minutes: 5
  primary_timeframe: 1m
  min_bars_required: 5

  regime_filter:
    enabled: true
    adx_period: 14
    adx_trend_threshold: 25
    adx_range_threshold: 20
    atr_period: 14
    atr_ma_period: 20
    use_hurst: true
    hurst_period: 100
    hurst_trend_threshold: 0.55
    hurst_range_threshold: 0.45

  kalman_regime:
    enabled: true
    timeframe: 15m
    long_only: false                # Two-sided: SELL re-enabled with confidence-gated sizing
    kalman_q: 0.00001
    kalman_r: 0.01
    rv_window: 20
    rv_ma_window: 100
    zscore_window: 20
    # v3 Loosen (2026-04-19): backtest shows 2× trades, 2× absolute return at
    # same PF/Sharpe. User accepts the 2.4× larger max-DD because account-level
    # max-loss is enforced outside this strategy. Raw config for reference:
    #   entry_threshold 2.0→1.5, trend_adx_min 20→17, kalman_confirm_bars 2→1,
    #   min_signal_strength 0.50→0.35, cooldown_bars 2→1.
    entry_threshold: 2.0            # 2026-05-05: v3-loose REVERTED (was 1.5) — testing v2 entry quality
    trend_adx_min: 17               # v3 loose: 20 -> 17 (KEPT pending isolation test)
    kalman_confirm_bars: 4          # 2026-06-22: 2→4 — trims weakest entries. 2026 PF 1.35→1.39, DD −16.9%→−15.1%; full-span PF 1.28→1.30, DD −13.1%→−11.8%, WR 47.3→47.7%. (5 gives back return.)
    min_signal_strength: 0.50       # 2026-05-05: v3-loose REVERTED (was 0.35) — BUY-side gate
    min_signal_strength_sell: 0.85  # 2026-06-22: 0.75→0.85 — drops weak counter-trend SELLs (gold bullish drift). 15m kalman backtest PF 1.24→1.28, maxDD −16.9%→−13.1%, Sharpe 0.23→0.27. Original basis 2026-05-05: SELL WR 14.6% vs BUY 33.9%.
    cooldown_bars: 2                # 2026-05-05: v3-loose REVERTED (was 1)
    atr_period: 14
    sl_atr_multiplier: 3.0          # 2026-05-06: 1.5/2.5 → 3.0 — 2-D SL×TP sweep on $10k showed (3.0, 4.0) is winrate sweet spot (WR 47.6%, PF 1.32)
    tp_atr_multiplier: 4.0          # 2026-05-06: 8.0 → 4.0 — XAU 15m trends rarely reach 8×ATR; tighter TP captures more wins without giving back via stops
    news_filter: true
    # Confidence gate: signals with conf >= threshold may stack up to risk.max_positions;
    # signals below threshold are limited to 1 open kalman_regime position at a time.
    high_confidence_threshold: 90.0
    # Session filter widened to ≥ 7 trading hours/day (was 8 split across 4 windows).
    session_filter_enabled: true
    allowed_sessions: [[1,4],[7,8],[10,12],[15,23]]   # 2026-06-04 (user): Asia 01-05, London 07-09 & 10-13 (skip h9), overlap+NY 15-24 (skip overlap bleeds h13/h14) - UTC. Restores Kalman's documented profitable NY evening h20-23 (h21 +$889); excludes the 3 bleed hours h9/h13/h14.
    ema_confirm_enabled: false
    macd_confirmation: false
    kalman_accel_enabled: false
    stoch_confirm_enabled: false
    range_rsi_buy: 42
    range_rsi_sell: 65              # 2026-05-05: 58 → 65 — require RSI deeper in overbought before shorting (BUY side stays at 42)

    # 2026-05-06: HTF directional gate for SELL only.
    # Trade-log evidence (1146 SELL trades, WR 14.9%, -$15k) shows even high-strength
    # SELL signals lose 85% of the time on XAU during a sustained bull window.
    # Gate: SELL only fires when 1H close < 1H EMA(50) — confirmed bearish HTF trend.
    # BUY-side untouched.
    htf_sell_filter_enabled: true
    htf_sell_resample_to: 1h
    htf_sell_ema_period: 50

  # Mini Medallion v2: +31% return, PF 1.59, DD 4.3% (backtest Jan 2025–Mar 2026)
  # v2 changes: long-only, session filter, lower threshold, higher RR, ADX filter

  # ── SUPPLY & DEMAND ZONE STRATEGY ─────────────────────────────────────────
  # Disabled by default — backtest before enabling live.

  # ── DESCENDING CHANNEL BREAKOUT (DCB) ──────────────────────────────
  # Detects descending channels via linear regression, identifies
  # structure shifts (higher-low formations), and trades confirmed
  # breakouts or trendline rejections with defined R:R.
  # Disabled by default — backtest before enabling live.

  # ── CONTINUATION BREAKOUT (Wyckoff stair-step) ───────────────────────
  # Two-leg breakout: tight range → impulse → re-accumulation → continuation.
  # State-machine: detects accumulation range → fast move (impulse) →
  # re-accumulation cluster → fires on second breakout in same direction.
  # Disabled by default — backtest before enabling live.

trading_hours:
  sessions:
    # ── ASIA (Tokyo/Sydney) 00:00–07:00 UTC — low vol, range-fade alpha ──────
    - name: asia
      start: "00:00"
      end: "07:00"
      enabled: true
      lot_size_multiplier: 0.7
